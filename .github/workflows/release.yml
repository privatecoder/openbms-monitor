name: Release

# A pushed tag v* builds the three binaries and publishes them as a prerelease of that tag; a manual run builds them
# as workflow artifacts only (no release).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            runner: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
          - name: windows-x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - name: windows-arm64
            runner: windows-latest
            target: aarch64-pc-windows-msvc
            bundles: nsis
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install frontend dependencies
        working-directory: app
        run: npm ci
      # the release text: the version's section of CHANGELOG.md plus the download notes (fails without a section)
      - name: Release notes
        id: notes
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          {
            echo 'body<<NOTES_END'
            tools/release_notes.sh "$(node -p "require('./app/package.json').version")"
            echo 'NOTES_END'
          } >> "$GITHUB_OUTPUT"
      - name: Build and publish
        if: startsWith(github.ref, 'refs/tags/')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # signs the update packages (.app.tar.gz, setup.exe) for the app's updater; public key in tauri.conf.json
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config src-tauri/tauri.release.conf.json
          # latest.json comes from the job below, once all three builds are uploaded
          includeUpdaterJson: false
          tagName: ${{ github.ref_name }}
          releaseName: OpenBMS Monitor ${{ github.ref_name }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: true
      - name: Build
        if: "!startsWith(github.ref, 'refs/tags/')"
        working-directory: app
        run: npm run tauri build -- --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - name: Upload artifacts
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v7
        with:
          name: openbms-monitor-${{ matrix.name }}
          path: |
            target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            target/${{ matrix.target }}/release/bundle/nsis/*.exe

  # The updater's manifest: one signed download per platform, from the assets the builds uploaded. One job writes it,
  # so parallel builds cannot overwrite each other's entries.
  updater-json:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Write and upload latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          version="$(node -p "require('./app/package.json').version")"
          assets="$(gh release view "$tag" --json assets -q '.assets')"
          entry() { # platform key, asset name suffix
            local name url sig
            name="$(jq -r --arg s "$2" '[.[] | select(.name | endswith($s))][0].name // empty' <<<"$assets")"
            [ -n "$name" ] || { echo "no asset *$2" >&2; exit 1; }
            url="$(jq -r --arg n "$name" '.[] | select(.name == $n) | .url' <<<"$assets")"
            gh release download "$tag" -p "$name.sig" -O sig.txt --clobber
            sig="$(cat sig.txt)"
            jq -n --arg k "$1" --arg u "$url" --arg s "$sig" '{($k): {url: $u, signature: $s}}'
          }
          platforms="$( { entry darwin-aarch64 .app.tar.gz; entry windows-x86_64 _x64-setup.exe; entry windows-aarch64 _arm64-setup.exe; } | jq -s 'add')"
          jq -n --arg v "$version" --arg d "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --arg n "$(tools/release_notes.sh "$version")" --argjson p "$platforms" \
            '{version: $v, notes: $n, pub_date: $d, platforms: $p}' > latest.json
          gh release upload "$tag" latest.json --clobber
