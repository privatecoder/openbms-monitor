[package]
name = "openbms-monitor"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "openbms_monitor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { workspace = true }
serde_json = { workspace = true }
rusqlite = { version = "0.40", features = ["bundled"] }
tauri-plugin-dialog = "2.8"
openbms-proto = { path = "../../crates/openbms-proto" }
openbms-flash = { path = "../../crates/openbms-flash" }
openbms-transport = { path = "../../crates/openbms-transport" }
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.10"
# local time in the frame capture export
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tauri-plugin-notification = "2.7"
tauri-plugin-updater = "2"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
# Home Assistant (MQTT) source: the add-on's OpenBMS feed; TLS with the platform's certificate store
rumqttc = { version = "0.25", default-features = false, features = ["use-rustls-no-provider"] }
rustls-platform-verifier = "0.7"

[target.'cfg(unix)'.dependencies]
# free disk space before a migration copies a database
libc = "0.2"
